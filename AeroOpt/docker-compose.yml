services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/aeroopt.db
    volumes:
      - aeroopt-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  aeroopt-data:
